global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api_gateway
    static_configs:
      - targets: ["api_gateway:8000"]

  - job_name: inference_gateway
    static_configs:
      - targets: ["inference_gateway:8001"]

  - job_name: worker
    static_configs:
      - targets: ["worker:8002"]

  - job_name: control_plane
    static_configs:
      - targets: ["control_plane:8003"]