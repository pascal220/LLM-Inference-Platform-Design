version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api_gateway:
    build: ./api_gateway
    container_name: api_gateway
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - INFERENCE_GATEWAY_URL=http://inference_gateway:8001
      - CONTROL_PLANE_URL=http://control_plane:8003
    depends_on:
      redis:
        condition: service_healthy
      control_plane:
        condition: service_started
    volumes:
      - ./shared:/app/shared

  inference_gateway:
    build: ./inference_gateway
    container_name: inference_gateway
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - CONTROL_PLANE_URL=http://control_plane:8003
    depends_on:
      redis:
        condition: service_healthy
      control_plane:
        condition: service_started
    volumes:
      - ./shared:/app/shared

  worker:
    build: ./worker
    container_name: worker
    environment:
      - REDIS_URL=redis://redis:6379
      - USE_MOCK=true
      - WORKER_ID=worker-1
      - CONTROL_PLANE_URL=http://control_plane:8003
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared
    # Uncomment below for real GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  control_plane:
    build: ./control_plane
    container_name: control_plane
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./shared:/app/shared
      - control_plane_data:/app/data

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api_gateway
      - inference_gateway
      - worker
      - control_plane

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  control_plane_data: